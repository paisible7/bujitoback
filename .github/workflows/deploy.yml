name: Deploy production

# GitHub = déclencheur uniquement. Tout le travail réel tourne sur le VPS.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    steps:
      - name: Deploy to VPS over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script_stop: true
          command_timeout: 15m
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.DEPLOY_PATH }}"
            if [ -z "$APP_DIR" ]; then
              APP_DIR="/home/paisible/web/apibudig.capslockdev.com/public_html"
            fi
            SERVICE="${SYSTEMD_SERVICE:-bujito_backend}"

            run_as_app() {
              if [ "$(id -un)" = "paisible" ]; then
                bash -lc "$1"
              else
                su - paisible -c "$1"
              fi
            }

            echo "[deploy] sync code = origin/main"
            run_as_app "cd '$APP_DIR' && git fetch origin && git checkout main && git reset --hard origin/main && SYSTEMD_SERVICE='$SERVICE' bash deploy/remote_update.sh --already-pulled"

            echo "[deploy] restart $SERVICE"
            if [ "$(id -un)" = "root" ]; then
              systemctl restart "$SERVICE"
              systemctl is-active --quiet "$SERVICE"
            elif sudo -n systemctl restart "$SERVICE" 2>/dev/null; then
              sudo -n systemctl is-active --quiet "$SERVICE"
            else
              echo "[deploy] restart systemd refusé — configure sudoers pour paisible (systemctl restart $SERVICE) ou utilise SSH_USER=root"
              exit 1
            fi
            echo "[deploy] service active"

      - name: Health check
        run: |
          url="https://apibudig.capslockdev.com/api/"
          echo "Checking $url"
          code="$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 "$url" || true)"
          echo "HTTP $code"
          if [ -z "$code" ] || [ "$code" = "000" ]; then
            echo "API unreachable"
            exit 1
          fi
          if [ "$code" -ge 500 ]; then
            echo "API returned server error"
            exit 1
          fi
