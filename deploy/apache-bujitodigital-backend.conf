<VirtualHost *:80>
  ServerName apibudig.capslockdev.com

  ProxyPreserveHost On
  ProxyRequests Off
  RequestHeader set X-Forwarded-Proto "https" env=HTTPS

  LimitRequestBody 26214400

  # Chemin réel LWS / cPanel
  Alias /media/ /home/paisible/web/apibudig.capslockdev.com/public_html/media/
  <Directory /home/paisible/web/apibudig.capslockdev.com/public_html/media>
    Require all granted
    Options -Indexes
    Header set Access-Control-Allow-Origin "*"
    Header set Cross-Origin-Resource-Policy "cross-origin"
  </Directory>

  Alias /static/ /home/paisible/web/apibudig.capslockdev.com/public_html/staticfiles/
  <Directory /home/paisible/web/apibudig.capslockdev.com/public_html/staticfiles>
    Require all granted
  </Directory>

  ProxyPass        /media/ !
  ProxyPass        /static/ !
  ProxyPass        / http://127.0.0.1:8000/
  ProxyPassReverse / http://127.0.0.1:8000/

  ErrorLog  ${APACHE_LOG_DIR}/bujitodigital-backend-error.log
  CustomLog ${APACHE_LOG_DIR}/bujitodigital-backend-access.log combined
</VirtualHost>
