<VirtualHost *:80>
  ServerName apibudig.capslockdev.com

  ProxyPreserveHost On
  ProxyRequests Off
  RequestHeader set X-Forwarded-Proto "https" env=HTTPS

  # Increase if you upload files (Excel import, images)
  LimitRequestBody 26214400

  # Servir les uploads AVANT le reverse proxy
  Alias /media/ /var/www/bujitodigital-backend/media/
  <Directory /var/www/bujitodigital-backend/media>
    Require all granted
    Options -Indexes
  </Directory>

  Alias /static/ /var/www/bujitodigital-backend/staticfiles/
  <Directory /var/www/bujitodigital-backend/staticfiles>
    Require all granted
  </Directory>

  ProxyPass        /media/ !
  ProxyPass        /static/ !
  ProxyPass        / http://127.0.0.1:8000/
  ProxyPassReverse / http://127.0.0.1:8000/

  ErrorLog  ${APACHE_LOG_DIR}/bujitodigital-backend-error.log
  CustomLog ${APACHE_LOG_DIR}/bujitodigital-backend-access.log combined
</VirtualHost>
