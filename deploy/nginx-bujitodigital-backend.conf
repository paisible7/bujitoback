server {
    listen 80;
    server_name apibudig.capslockdev.com;

    client_max_body_size 25m;

    # Fichiers uploades (photos colis / commandes) — OBLIGATOIRE en prod
    # Ajuster le chemin si ton deploy est ailleurs.
    location /media/ {
        alias /var/www/bujitodigital-backend/media/;
        access_log off;
        expires 7d;
    }

    # Static Django (admin, etc.) apres collectstatic
    location /static/ {
        alias /var/www/bujitodigital-backend/staticfiles/;
        access_log off;
        expires 7d;
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass http://127.0.0.1:8000;
    }
}
