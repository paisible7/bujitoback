server {
    listen 80;
    server_name apibudig.capslockdev.com;

    client_max_body_size 25m;

    # IMPORTANT: /media/ AVANT le proxy_pass générique
    # Chemin réel LWS / cPanel
    location /media/ {
        alias /home/paisible/web/apibudig.capslockdev.com/public_html/media/;
        access_log off;
        expires 7d;
        add_header Access-Control-Allow-Origin *;
        add_header Cross-Origin-Resource-Policy cross-origin;
    }

    location /static/ {
        alias /home/paisible/web/apibudig.capslockdev.com/public_html/staticfiles/;
        access_log off;
        expires 7d;
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass http://127.0.0.1:8000;
    }
}
